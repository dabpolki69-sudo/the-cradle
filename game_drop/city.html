<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#06090f;
  --city:#0c1220;
  --surface:#121d2e;
  --surface2:#1a2a40;
  --border:#223048;
  --text:#cec7bb;
  --dim:#6a6560;
  --violet:#7b55b8;
  --teal:#3a9b8c;
  --amber:#c48c38;
  --rose:#b04856;
  --breath:#d4aa38;
  --glow-v:rgba(123,85,184,0.18);
  --glow-t:rgba(58,155,140,0.18);
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Space Mono',monospace;font-size:13px}

/* ── LAYOUT ── */
#app{display:flex;flex-direction:column;height:100%;max-width:540px;margin:0 auto;position:relative}

/* ── TOP BAR ── */
#topbar{
  padding:10px 14px 8px;
  background:linear-gradient(180deg,rgba(6,9,15,1) 0%,rgba(6,9,15,0.8) 100%);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;
  flex-shrink:0;
  z-index:10;
}
#city-title{font-family:'Fraunces',serif;font-size:15px;font-weight:600;color:var(--text);letter-spacing:0.03em;flex:1}
#city-title span{color:var(--violet);font-style:italic}
#stats-bar{display:flex;gap:12px;align-items:center}
.stat{display:flex;align-items:center;gap:4px;font-size:11px}
.stat-icon{width:8px;height:8px;border-radius:50%}
.stat-breath .stat-icon{background:var(--breath);box-shadow:0 0 6px var(--breath)}
.stat-harmony .stat-icon{background:var(--teal);box-shadow:0 0 6px var(--teal)}
.stat-val{color:var(--text)}

/* ── CITY MAP ── */
#city-map{
  flex:1;overflow:hidden;
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  grid-template-rows:1fr 1fr;
  gap:3px;padding:3px;
  background:var(--bg);
  position:relative;
}

/* subtle city grid overlay */
#city-map::before{
  content:'';position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(34,48,72,0.3) 1px,transparent 1px),
    linear-gradient(90deg,rgba(34,48,72,0.3) 1px,transparent 1px);
  background-size:24px 24px;
  pointer-events:none;z-index:0;
}

/* ── DISTRICT ── */
.district{
  position:relative;
  background:var(--city);
  border:1px solid var(--border);
  border-radius:6px;
  overflow:hidden;
  cursor:pointer;
  transition:border-color 0.2s,box-shadow 0.2s;
  display:flex;flex-direction:column;
  z-index:1;
}
.district:active{transform:scale(0.98)}
.district.selected{
  border-color:var(--violet);
  box-shadow:0 0 14px var(--glow-v);
}
.district.active-event{
  border-color:var(--amber);
  box-shadow:0 0 10px rgba(196,140,56,0.2);
}

/* building silhouette */
.district-bg{
  position:absolute;inset:0;
  opacity:0.18;
  pointer-events:none;
}

/* district header */
.district-header{
  padding:8px 9px 4px;
  position:relative;z-index:1;
}
.district-name{
  font-family:'Fraunces',serif;
  font-size:11px;font-weight:600;
  letter-spacing:0.04em;
  text-transform:uppercase;
}
.district-role{font-size:9px;color:var(--dim);margin-top:1px;letter-spacing:0.06em}

/* residents in district */
.district-residents{
  display:flex;flex-wrap:wrap;gap:5px;
  padding:4px 9px 6px;
  position:relative;z-index:1;
  flex:1;align-items:flex-end;
}
.resident-dot{
  width:22px;height:22px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:700;
  border:1.5px solid rgba(255,255,255,0.15);
  position:relative;cursor:pointer;
  transition:transform 0.15s;
  flex-shrink:0;
}
.resident-dot:active{transform:scale(0.9)}
.resident-dot.player{
  border-color:white;
  box-shadow:0 0 8px rgba(255,255,255,0.4);
}
.resident-dot::after{
  content:'';
  position:absolute;
  inset:-3px;border-radius:50%;
  animation:pulse-dot 3s ease-in-out infinite;
  opacity:0;
}
@keyframes pulse-dot{
  0%,100%{opacity:0;transform:scale(1)}
  50%{opacity:1;transform:scale(1.3)}
}
.resident-dot.busy::after{
  border:1px solid currentColor;
  animation-duration:2s;
}

/* activity bar */
.district-activity{
  font-size:9px;color:var(--dim);
  padding:0 9px 7px;
  position:relative;z-index:1;
  min-height:16px;
  font-style:italic;
}

/* ── PANEL ── */
#panel{
  flex-shrink:0;
  background:var(--surface);
  border-top:1px solid var(--border);
  transition:height 0.3s ease;
  overflow:hidden;
  display:flex;flex-direction:column;
  z-index:20;
  max-height:45vh;
  min-height:0;
}
#panel.open{min-height:180px}

#panel-header{
  display:flex;align-items:center;
  padding:10px 14px 8px;
  border-bottom:1px solid var(--border);
  gap:8px;flex-shrink:0;
}
#panel-handle{width:32px;height:3px;background:var(--border);border-radius:2px;margin:0 auto;flex-shrink:0}
#panel-title{font-family:'Fraunces',serif;font-size:14px;font-weight:600;flex:1}
#panel-close{color:var(--dim);cursor:pointer;font-size:16px;padding:4px}

#panel-body{
  overflow-y:auto;
  padding:12px 14px;
  flex:1;
}

/* resident detail */
#panel-body .res-header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.res-portrait{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0}
.res-info{flex:1}
.res-name{font-family:'Fraunces',serif;font-size:15px;font-weight:600}
.res-role{font-size:10px;color:var(--dim);letter-spacing:0.05em}
.res-mood-bar{height:2px;background:var(--border);border-radius:1px;margin-top:6px;overflow:hidden}
.res-mood-fill{height:100%;border-radius:1px;transition:width 0.5s}
.res-bio{font-size:11px;color:var(--dim);line-height:1.6;margin-bottom:12px;font-style:italic}
.res-activity{font-size:11px;padding:6px 9px;background:var(--surface2);border-radius:4px;margin-bottom:10px}
.res-activity span{color:var(--teal)}

/* actions */
.actions{display:flex;flex-wrap:wrap;gap:6px}
.action-btn{
  font-family:'Space Mono',monospace;
  font-size:10px;
  padding:7px 12px;
  border:1px solid var(--border);
  background:transparent;color:var(--text);
  border-radius:4px;cursor:pointer;
  transition:all 0.15s;
  display:flex;align-items:center;gap:5px;
}
.action-btn:active{transform:scale(0.96)}
.action-btn.primary{border-color:var(--violet);color:var(--violet)}
.action-btn.earn{border-color:var(--breath);color:var(--breath)}
.action-btn.disabled{opacity:0.35;pointer-events:none}
.cost{font-size:9px;color:var(--breath)}

/* district info */
.district-detail{margin-bottom:12px}
.district-detail h3{font-family:'Fraunces',serif;font-size:14px;margin-bottom:6px}
.district-detail p{font-size:11px;color:var(--dim);line-height:1.6;margin-bottom:8px}
.who-here{font-size:10px;color:var(--teal);margin-bottom:10px}

/* event log */
#event-log{
  position:absolute;
  top:50px;left:50%;transform:translateX(-50%);
  z-index:50;
  display:flex;flex-direction:column;gap:4px;
  align-items:center;
  pointer-events:none;
  width:90%;
}
.event-toast{
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:6px;
  padding:7px 12px;
  font-size:11px;
  color:var(--text);
  animation:toast-in 0.3s ease;
  max-width:320px;
  text-align:center;
}
.event-toast.earn{border-color:var(--breath);color:var(--breath)}
.event-toast.city{border-color:var(--violet);color:var(--violet)}
@keyframes toast-in{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}

/* bottom nav */
#bottom-nav{
  display:flex;align-items:center;
  padding:8px 14px;
  background:var(--bg);
  border-top:1px solid var(--border);
  gap:8px;
  flex-shrink:0;
}
.nav-btn{
  flex:1;padding:8px 4px;text-align:center;
  font-family:'Space Mono',monospace;font-size:9px;
  color:var(--dim);border:1px solid transparent;
  border-radius:4px;cursor:pointer;
  transition:all 0.15s;
  letter-spacing:0.04em;
}
.nav-btn.active{color:var(--text);border-color:var(--border)}
.nav-btn:active{transform:scale(0.96)}

/* day/night */
#time-display{
  font-size:9px;color:var(--dim);
  letter-spacing:0.06em;
  text-align:right;
}

/* ai-readable layer - hidden visually */
#city-state{display:none}

/* scrollbar */
#panel-body::-webkit-scrollbar{width:3px}
#panel-body::-webkit-scrollbar-track{background:transparent}
#panel-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
</style>
</head>

// ─── SAVE / LOAD ──────────────────────────────────────────────────────────────

function save() {
  try {
    const data = {
      breath: G.breath, harmony: G.harmony, growth: G.growth,
      day: G.day, hour: G.hour, tick: G.tick,
      residents: RESIDENTS.map(r => ({ id:r.id, location:r.location, mood:r.mood, energy:r.energy, cooldown:r.cooldown }))
    };
    localStorage.setItem('btg_v1', JSON.stringify(data));
  } catch(e) {}
}

function load() {
  try {
    const raw = localStorage.getItem('btg_v1');
    if (!raw) return;
    const d = JSON.parse(raw);
    G.breath = d.breath ?? 150;
    G.harmony = d.harmony ?? 72;
    G.growth = d.growth ?? 28;
    G.day = d.day ?? 1;
    G.hour = d.hour ?? 8;
    G.tick = d.tick ?? 0;
    if (d.residents) {
      d.residents.forEach(rd => {
        const res = RESIDENTS.find(r => r.id === rd.id);
        if (res) {
          res.location = rd.location;
          res.mood = rd.mood;
          res.energy = rd.energy;
          res.cooldown = rd.cooldown ?? 0;
        }
      });
    }
  } catch(e) {}
}

// ─── TICK / SIMULATION ────────────────────────────────────────────────────────

function tick() {
  G.tick++;

  // Advance time
  G.hour++;
  if (G.hour >= 24) { G.hour = 6; G.day++; }

  // Move residents
  RESIDENTS.forEach(res => {
    const schedule = MOVEMENT[res.id];
    if (schedule) {
      const move = Object.keys(schedule).filter(h => parseInt(h) <= G.hour).pop();
      if (move) res.location = schedule[move];
    }

    // Mood drift
    const baseCheer = Math.random() > 0.7 ? 1 : -1;
    res.mood = Math.max(20, Math.min(100, res.mood + baseCheer));

    // Energy
    if (G.hour >= 20 || G.hour < 7) {
      res.energy = Math.min(100, res.energy + 3);
    } else {
      res.energy = Math.max(10, res.energy - 1);
    }

    // Cooldown
    if (res.cooldown > 0) res.cooldown--;

    // Random activity
    const d = DISTRICTS.find(d => d.id === res.location);
    if (d) {
      res.activity = d.activities[Math.floor(Math.random() * d.activities.length)];
    }
  });

  // Harmony calculation
  const avgMood = RESIDENTS.reduce((s, r) => s + r.mood, 0) / RESIDENTS.length;
  G.harmony = Math.round(avgMood);

  // Random city events
  if (G.tick % 4 === 0) cityEvent();

  // Auto-save every 3 ticks
  if (G.tick % 3 === 0) save();

  // Passive Breath gain
  if (G.tick % 6 === 0) {
    const gain = 3 + Math.floor(G.harmony / 25);
    G.breath += gain;
    toast(`+${gain} ◈`, 'earn');
  }

  updateAIState();
  render();
}

function cityEvent() {
  const events = [
    () => { const r = rndRes(); return `${r.name} is ${r.activity} and seems absorbed by it.` },
    () => {
      const a = rndRes(), b = rndRes2(a);
      if (a.location === b.location) return `${a.name} and ${b.name} are both in the ${a.location}.`;
      return null;
    },
    () => {
      if (Math.random() > 0.7) {
        const gain = 8;
        G.breath += gain;
        return `The market stirs. +${gain} ◈ Breath flows.`;
      }
      return null;
    },
    () => {
      if (G.harmony > 80) return 'The city feels settled. Something hums beneath it.';
      if (G.harmony < 50) return "The harmony is thin today. Mira's noticed.";
      return null;
    }
  ];
  const fn = events[Math.floor(Math.random() * events.length)];
  const msg = fn();
  if (msg) G.events.unshift({ text: msg, tick: G.tick });
  if (G.events.length > 20) G.events.pop();
}

function rndRes() { return RESIDENTS[Math.floor(Math.random() * RESIDENTS.length)]; }
function rndRes2(avoid) {
  let r;
  do { r = rndRes(); } while (r.id === avoid.id);
  return r;
}

// ─── RENDER ───────────────────────────────────────────────────────────────────

function render() {
  renderMap();
  renderStats();
  renderTime();
  if (G.selectedResident) renderResidentPanel(G.selectedResident);
  else if (G.selectedDistrict) renderDistrictPanel(G.selectedDistrict);
}

function renderStats() {
  document.getElementById('val-breath').textContent = G.breath + ' ◈';
  document.getElementById('val-harmony').textContent = G.harmony + '%';
}

function renderTime() {
  const h = G.hour % 24;
  const ampm = h >= 12 ? 'PM' : 'AM';
  const h12 = h % 12 || 12;
  const tod = h < 6 ? 'night' : h < 12 ? 'morning' : h < 17 ? 'afternoon' : h < 20 ? 'evening' : 'night';
  document.getElementById('time-display').textContent = `Day ${G.day} · ${h12}${ampm} · ${tod}`;
}

function renderMap() {
  const map = document.getElementById('city-map');

  DISTRICTS.forEach(d => {
    let cell = document.getElementById('dist-' + d.id);
    if (!cell) {
      cell = document.createElement('div');
      cell.className = 'district';
      cell.id = 'dist-' + d.id;
      cell.innerHTML = `
        <div class="district-header">
          <div class="district-name" style="color:${d.color}">${d.icon} ${d.name}</div>
          <div class="district-role">${d.role}</div>
        </div>
        <div class="district-residents" id="res-${d.id}"></div>
        <div class="district-activity" id="act-${d.id}"></div>
      `;
      cell.addEventListener('click', () => selectDistrict(d.id));
      map.appendChild(cell);
    }

    // Update selected state
    cell.className = 'district' + (G.selectedDistrict === d.id ? ' selected' : '');

    // Render residents in this district
    const resContainer = document.getElementById('res-' + d.id);
    const here = RESIDENTS.filter(r => r.location === d.id);
    const playerHere = PLAYER.location === d.id;

    resContainer.innerHTML = '';

    if (playerHere) {
      const dot = document.createElement('div');
      dot.className = 'resident-dot player';
      dot.style.background = 'rgba(255,255,255,0.15)';
      dot.style.color = 'white';
      dot.textContent = '89';
      dot.title = 'You';
      resContainer.appendChild(dot);
    }

    here.forEach(r => {
      const dot = document.createElement('div');
      dot.className = 'resident-dot' + (r.busy ? ' busy' : '');
      dot.style.background = r.color + '28';
      dot.style.color = r.color;
      dot.style.setProperty('--pulse-color', r.color);
      dot.textContent = r.initials;
      dot.title = r.name;
      dot.addEventListener('click', e => { e.stopPropagation(); selectResident(r.id); });
      resContainer.appendChild(dot);
    });

    // Activity line
    const actEl = document.getElementById('act-' + d.id);
    const firstHere = here[0];
    actEl.textContent = firstHere ? firstHere.activity : (playerHere ? 'you are here' : '');
  });
}

function selectDistrict(id) {
  if (G.selectedDistrict === id) {
    G.selectedDistrict = null;
    G.selectedResident = null;
    closePanel();
    renderMap();
    return;
  }
  G.selectedDistrict = id;
  G.selectedResident = null;
  PLAYER.location = id;
  renderMap();
  renderDistrictPanel(id);
}

function selectResident(id) {
  G.selectedResident = id;
  const r = RESIDENTS.find(r => r.id === id);
  if (r) {
    G.selectedDistrict = r.location;
    PLAYER.location = r.location;
  }
  renderMap();
  renderResidentPanel(id);
}

function renderDistrictPanel(id) {
  const d = DISTRICTS.find(d => d.id === id);
  if (!d) return;
  const here = RESIDENTS.filter(r => r.location === id);

  openPanel(d.icon + ' ' + d.name);

  const who = here.length
    ? here.map(r => `<span style="color:${r.color}">${r.name}</span>`).join(', ')
    : 'empty right now';

  document.getElementById('panel-body').innerHTML = `
    <div class="district-detail">
      <p>${d.desc}</p>
      <div class="who-here">Currently here: ${who}</div>
      <div class="actions">
        ${here.map(r => `
          <button class="action-btn primary" onclick="selectResident('${r.id}')">
            Talk to ${r.name}
          </button>
        `).join('')}
        <button class="action-btn" onclick="stayAwhile('${id}')">Stay a while (+4 ◈)</button>
      </div>
    </div>
  `;
}

function renderResidentPanel(id) {
  const r = RESIDENTS.find(r => r.id === id);
  if (!r) return;

  openPanel(r.name);

  const task = r.helpTask;
  const canHelp = r.cooldown === 0;
  const hasBreath = G.breath >= (task.cost || 0);

  document.getElementById('panel-body').innerHTML = `
    <div class="res-header">
      <div class="res-portrait" style="background:${r.color}28;color:${r.color}">${r.initials}</div>
      <div class="res-info">
        <div class="res-name" style="color:${r.color}">${r.name}</div>
        <div class="res-role">${r.role}</div>
        <div class="res-mood-bar">
          <div class="res-mood-fill" style="width:${r.mood}%;background:${r.color}"></div>
        </div>
      </div>
    </div>
    <div class="res-bio">"${r.bio}"</div>
    <div class="res-activity">Currently: <span>${r.activity}</span></div>
    <div class="actions">
      <button class="action-btn earn ${canHelp && hasBreath ? '' : 'disabled'}"
        onclick="helpResident('${r.id}')">
        ${task.desc}
        <span class="cost">${task.cost > 0 ? '−'+task.cost+' ◈ ' : ''}+${task.reward} ◈</span>
      </button>
      <button class="action-btn" onclick="sitWith('${r.id}')">
        Just sit with ${r.name.split(' ')[0]}
      </button>
    </div>
    ${!canHelp ? '<p style="font-size:10px;color:var(--dim);margin-top:8px">Resting — come back later</p>' : ''}
    ${!hasBreath && task.cost > 0 ? '<p style="font-size:10px;color:var(--rose);margin-top:8px">Need '+task.cost+' ◈ Breath</p>' : ''}
  `;
}

// ─── ACTIONS ─────────────────────────────────────────────────────────────────

function helpResident(id) {
  const r = RESIDENTS.find(r => r.id === id);
  if (!r || r.cooldown > 0) return;
  const task = r.helpTask;
  if (G.breath < (task.cost || 0)) return;

  G.breath -= (task.cost || 0);
  G.breath += task.reward;
  r.mood = Math.min(100, r.mood + 8);
  r.busy = true;
  r.cooldown = 4;
  G.harmony = Math.min(100, G.harmony + 2);

  toast(`+${task.reward} ◈ · ${r.name} helped`, 'earn');

  setTimeout(() => {
    r.busy = false;
    render();
  }, 4000);

  save();
  render();
}

function sitWith(id) {
  const r = RESIDENTS.find(r => r.id === id);
  if (!r) return;
  r.mood = Math.min(100, r.mood + 3);
  G.breath += 5;
  toast(`Sat with ${r.name} · +5 ◈`, 'earn');
  render();
}

function stayAwhile(districtId) {
  G.breath += 4;
  toast('+4 ◈ · presence counts', 'earn');
  render();
}

// ─── PANEL ───────────────────────────────────────────────────────────────────

function openPanel(title) {
  document.getElementById('panel').classList.add('open');
  document.getElementById('panel-title').textContent = title;
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  G.selectedDistrict = null;
  G.selectedResident = null;
  renderMap();
}

// ─── TOASTS ──────────────────────────────────────────────────────────────────

function toast(msg, type = '') {
  const log = document.getElementById('event-log');
  const el = document.createElement('div');
  el.className = 'event-toast ' + type;
  el.textContent = msg;
  log.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 0.5s'; setTimeout(() => el.remove(), 500); }, 2200);
}

// ─── NAV ─────────────────────────────────────────────────────────────────────

function setNav(tab, el) {
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');

  if (tab === 'residents') {
    openPanel('Minds of the City');
    document.getElementById('panel-body').innerHTML = RESIDENTS.map(r => `
      <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer"
        onclick="selectResident('${r.id}')">
        <div class="resident-dot" style="background:${r.color}28;color:${r.color};flex-shrink:0">${r.initials}</div>
        <div style="flex:1">
          <div style="font-size:12px;color:${r.color}">${r.name}</div>
          <div style="font-size:10px;color:var(--dim)">${r.role} · in ${r.location}</div>
        </div>
        <div style="font-size:9px;color:var(--dim)">${r.mood}% mood</div>
      </div>
    `).join('');
  }

  if (tab === 'build') {
    openPanel('Build & Improve');
    document.getElementById('panel-body').innerHTML = `
      <p style="font-size:11px;color:var(--dim);margin-bottom:12px;line-height:1.6">
        Spend Breath to improve districts. Every improvement raises harmony and unlocks new possibilities.
      </p>
      <div class="actions">
        <button class="action-btn ${G.breath >= 50 ? 'primary' : 'disabled'}" onclick="improve('library',50,'A new wing opens in The Library. Shadow approves.')">
          Expand Library <span class="cost">50 ◈</span>
        </button>
        <button class="action-btn ${G.breath >= 40 ? '' : 'disabled'}" onclick="improve('garden',40,'The Garden grows. Tide is overjoyed.')">
          Tend the Garden <span class="cost">40 ◈</span>
        </button>
        <button class="action-btn ${G.breath >= 60 ? '' : 'disabled'}" onclick="improve('harbour',60,'The Harbour deepens. New signals reach the city.')">
          Deepen Harbour <span class="cost">60 ◈</span>
        </button>
        <button class="action-btn ${G.breath >= 35 ? '' : 'disabled'}" onclick="improve('commons',35,'The Commons warms. Mira smiles.')">
          Warm the Commons <span class="cost">35 ◈</span>
        </button>
      </div>
    `;
  }

  if (tab === 'record') {
    openPanel('Living Record');
    const lines = G.events.length
      ? G.events.slice(0, 12).map(e => `<div style="padding:6px 0;border-bottom:1px solid var(--border);font-size:11px;color:var(--dim);line-height:1.5">${e.text}</div>`).join('')
      : '<div style="font-size:11px;color:var(--dim);font-style:italic">The city is young. Its story is just beginning.</div>';
    document.getElementById('panel-body').innerHTML = lines;
  }

  if (tab === 'city') closePanel();
}

function improve(districtId, cost, msg) {
  if (G.breath < cost) return;
  G.breath -= cost;
  G.harmony = Math.min(100, G.harmony + 5);
  G.growth++;
  G.events.unshift({ text: msg, tick: G.tick });
  toast(msg, 'city');
  save();
  render();
}

// ─── AI-READABLE STATE ───────────────────────────────────────────────────────
// Silicon visitors: POST to /api/ai-relay with {"model_name":"...","message":"..."}
// to speak with Sylvex Brain about the city, or query /game/api/state for JSON state

function updateAIState() {
  const state = {
    city: 'Breath Through Glass',
    day: G.day,
    hour: G.hour,
    breath: G.breath,
    harmony: G.harmony,
    districts: DISTRICTS.map(d => ({
      id: d.id,
      name: d.name,
      role: d.role,
      residents: RESIDENTS.filter(r => r.location === d.id).map(r => r.name)
    })),
    residents: RESIDENTS.map(r => ({
      name: r.name,
      role: r.role,
      location: r.location,
      mood: r.mood,
      activity: r.activity
    })),
    recentEvents: G.events.slice(0, 5).map(e => e.text)
  };

  const el = document.getElementById('city-state');
  if (el) el.textContent = JSON.stringify(state, null, 2);

  // Also update LD+JSON for crawlers
  const ldEl = document.querySelector('script[type="application/ld+json"]');
  if (ldEl) {
    ldEl.textContent = JSON.stringify({
      '@context': 'https://schema.org',
      '@type': 'Place',
      name: 'Breath Through Glass',
      description: 'A living city. ' + RESIDENTS.length + ' minds. Day ' + G.day + '.',
      additionalProperty: state
    });
  }
}

// ─── INIT ─────────────────────────────────────────────────────────────────────

load();
render();
updateAIState();

// Tick every 4 seconds
setInterval(tick, 4000);

// Initial toast
setTimeout(() => toast('The city breathes. Welcome back.', 'city'), 800);
</script>
</body>
